<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>List Blood Requests</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .page-header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .action-buttons {
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            background: #874f72;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background: #673954;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background: #874f72;
            color: white;
        }

        tbody tr:nth-child(even) {
            background: #f9f4f7;
        }

        .message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <header class="topbar">
        <div class="nav-container">

            <a class="brand" href="index.html">
                Blood Bank Management
            </a>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="donors.html">Donors</a>
                <a href="blood-stock.html">Blood Stock</a>
                <a href="blood-requests.html">Blood Requests</a>
                <a href="reports.html">Reports</a>
            </nav>

        </div>
    </header>

    <!-- Main Content -->
    <main class="form-container">
        <div class="list-requests image">
            <img src="images/list-requests.jpg"
            alt="blood requests list">
        </div>

        <section class="page-header">

            <h1>List Blood Requests</h1>

            <p>
                View all blood requests registered in the database.
            </p>

        </section>

        <!-- Buttons -->
        <div class="action-buttons">

            <a href="blood-requests.html" class="btn">
                Back to Blood Requests
            </a>

            <a href="add-request.html" class="btn">
                Add New Request
            </a>

            <button type="button" class="btn" id="refreshButton">
                Refresh List
            </button>

        </div>

        <!-- Message -->
        <p id="message" class="message" role="status">
            Loading blood requests...
        </p>

        <!-- Blood Request Table -->
        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>Request ID</th>
                        <th>Hospital Name</th>
                        <th>Blood Group</th>
                        <th>Units Required</th>
                        <th>Request Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="requestRows">
                    <!-- Database records appear here -->
                </tbody>
            </table>

        </div>

    </main>

    <script>
        async function loadRequests() {

            const tbody = document.getElementById("requestRows");
            const message = document.getElementById("message");

            message.textContent = "Loading blood requests...";
            tbody.replaceChildren();

            try {

                const response = await fetch("/api/requests");

                if (!response.ok) {
                    throw new Error(
                        "Server error: " + response.status
                    );
                }

                const requests = await response.json();

                if (!Array.isArray(requests)) {
                    throw new Error(
                        "The API did not return a list of requests."
                    );
                }

                if (requests.length === 0) {
                    message.textContent = "No blood requests found.";
                    return;
                }

                requests.forEach(request => {

                    const row = document.createElement("tr");

                    const values = [
                        request.request_id,
                        request.hospital_name,
                        request.blood_group,
                        request.units_required,
                        request.request_date,
                        request.status
                    ];

                    values.forEach(value => {

                        const cell = document.createElement("td");

                        cell.textContent =
                            value === null || value === undefined
                                ? ""
                                : value;

                        row.appendChild(cell);

                    });

                    tbody.appendChild(row);

                });

                message.textContent =
                    "Total blood requests: " + requests.length;

            } catch (error) {

                message.textContent =
                    "Unable to load blood requests. " +
                    "Check your server and /api/requests route.";

                console.error("Blood request loading error:", error);

            }
        }

        document.getElementById("refreshButton")
            .addEventListener("click", loadRequests);

        loadRequests();
    </script>

</body>

</html>
