<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Blood Request</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Center the image */
        main.container > .page-image {
            display: block !important;
            width: 600px !important;
            max-width: 100% !important;
            height: 260px !important;
            margin: 25px auto 20px !important;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            overflow: hidden;
            border-radius: 10px;
            box-sizing: border-box;
            float: none !important;
        }

        main.container > .page-image img {
            display: block !important;
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            object-fit: cover;
            object-position: center;
            margin: 0 !important;
            padding: 0 !important;
            border-radius: 10px;
            float: none !important;
        }

        /* Center the heading and description */
        .page-heading {
            width: 100%;
            text-align: center !important;
            margin: 20px auto 25px !important;
        }

        .page-heading h1 {
            text-align: center !important;
            margin-bottom: 10px;
        }

        .page-heading p {
            text-align: center !important;
            margin: 0 auto;
        }

        /* Center the form */
        main.container > .form-container {
            width: 100%;
            max-width: 650px;
            box-sizing: border-box;
            margin: 0 auto 30px;
        }

        .form-container input,
        .form-container select {
            width: 100%;
            box-sizing: border-box;
        }

        #msg {
            overflow-wrap: anywhere;
        }

        @media (max-width: 650px) {
            main.container > .page-image {
                width: 100% !important;
                height: 220px !important;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <header>
        <div class="container">
            <h2>Blood Bank Management System</h2>

            <nav>
                <a href="index.html">Home</a>
                <a href="donors.html">Donors</a>
                <a href="blood-stock.html">Blood Stock</a>
                <a href="blood-requests.html">Blood Requests</a>
                <a href="reports.html">Reports</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <!-- Centered Image -->
        <div class="page-image">
            <img
                src="images/update-request.jpg"
                alt="Update blood request"
            >
        </div>

        <!-- Centered Heading -->
        <section class="page-heading">
            <h1>Update Blood Request</h1>
            <p>Select a request, load its details, and save your changes.</p>
        </section>

        <!-- Update Request Form -->
        <div class="form-container">

            <div class="form-group">
                <label for="rid">Select Request</label>

                <select id="rid">
                    <option value="">Loading requests...</option>
                </select>
            </div>

            <button type="button" id="load">
                Load Request
            </button>

            <hr style="margin:22px 0;border:0;border-top:1px solid #eadfce">

            <form id="f">

                <div class="form-group">
                    <label for="hospital_name">Hospital Name</label>
                    <input
                        id="hospital_name"
                        name="hospital_name"
                        type="text"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="blood_group">Blood Group</label>

                    <select id="blood_group" name="blood_group" required>
                        <option value="">Choose</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="units_required">Units Required</label>
                    <input
                        id="units_required"
                        name="units_required"
                        type="number"
                        min="1"
                        step="1"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="request_date">Request Date</label>
                    <input
                        id="request_date"
                        name="request_date"
                        type="date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="status">Status</label>

                    <select id="status" name="status" required>
                        <option value="Pending">Pending</option>
                        <option value="Processing">Processing</option>
                        <option value="Fulfilled">Fulfilled</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <button type="submit" id="save">
                    Save Changes
                </button>

                <p id="msg" role="status" aria-live="polite"></p>

            </form>
        </div>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Blood Bank Management System</p>
        </div>
    </footer>

    <script>
        const sel = document.getElementById("rid");
        const f = document.getElementById("f");
        const msg = document.getElementById("msg");
        const loadButton = document.getElementById("load");
        const saveButton = document.getElementById("save");

        function showMessage(text, type) {
            msg.textContent = text;
            msg.className = "message " + type;
        }

        async function loadOptions() {
            try {
                const r = await fetch("/api/requests");
                const d = await r.json();

                if (!r.ok) {
                    throw Error(
                        d.error || "Could not load requests."
                    );
                }

                const previousValue = sel.value;

                sel.innerHTML =
                    '<option value="">Select request</option>';

                d.forEach(function (x) {
                    const o = document.createElement("option");

                    o.value = x.request_id;
                    o.textContent =
                        x.request_id + " - " + x.hospital_name;

                    sel.appendChild(o);
                });

                if (d.some(x =>
                    String(x.request_id) === previousValue
                )) {
                    sel.value = previousValue;
                }

                if (d.length === 0) {
                    showMessage(
                        "No blood requests available.",
                        "error"
                    );
                }

            } catch (e) {
                showMessage(e.message, "error");
            }
        }

        loadButton.addEventListener("click", async function () {
            if (!sel.value) {
                showMessage("Please select a request.", "error");
                return;
            }

            try {
                loadButton.disabled = true;
                loadButton.textContent = "Loading...";

                const r = await fetch(
                    "/api/requests/" +
                    encodeURIComponent(sel.value)
                );

                const d = await r.json();

                if (!r.ok) {
                    throw Error(
                        d.error || "Could not load request."
                    );
                }

                const x = Array.isArray(d) ? d[0] : d;

                if (!x || !x.request_id) {
                    throw Error("Request not found.");
                }

                f.elements["hospital_name"].value =
                    x.hospital_name ?? "";

                f.elements["blood_group"].value =
                    x.blood_group ?? "";

                f.elements["units_required"].value =
                    x.units_required ?? "";

                f.elements["request_date"].value =
                    String(x.request_date ?? "").slice(0, 10);

                f.elements["status"].value =
                    x.status ?? "Pending";

                showMessage("Request loaded successfully.", "success");

            } catch (e) {
                showMessage(e.message, "error");

            } finally {
                loadButton.disabled = false;
                loadButton.textContent = "Load Request";
            }
        });

        f.addEventListener("submit", async function (e) {
            e.preventDefault();

            if (!sel.value) {
                showMessage("Select a request first.", "error");
                return;
            }

            if (!f.checkValidity()) {
                f.reportValidity();
                return;
            }

            const units = Number(f.elements["units_required"].value);

            if (!Number.isInteger(units) || units < 1) {
                showMessage(
                    "Units required must be a positive whole number.",
                    "error"
                );
                return;
            }

            const updatedRequest = {
                hospital_name:
                    f.elements["hospital_name"].value.trim(),

                blood_group:
                    f.elements["blood_group"].value,

                units_required: units,

                request_date:
                    f.elements["request_date"].value,

                status:
                    f.elements["status"].value
            };

            try {
                saveButton.disabled = true;
                saveButton.textContent = "Saving...";

                const r = await fetch(
                    "/api/requests/" +
                    encodeURIComponent(sel.value),
                    {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(updatedRequest)
                    }
                );

                const d = await r.json();

                if (!r.ok) {
                    throw Error(
                        d.details ||
                        d.error ||
                        d.message ||
                        "Update failed."
                    );
                }

                showMessage(
                    d.message || "Request updated successfully!",
                    "success"
                );

                await loadOptions();

            } catch (e) {
                showMessage(e.message, "error");

            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "Save Changes";
            }
        });

        loadOptions();
    </script>

</body>
</html>
