<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blood Request</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div class="nav-container">
        <a class="brand" href="index.html">Blood Bank Management</a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="donors.html">Donors</a>
            <a href="blood-stock.html">Blood Stock</a>
            <a href="blood-requests.html">Blood Requests</a>
            <a href="reports.html">Reports</a>
        </nav>
    </div>
</header>

<main class="form-container">
    <h1>Add Blood Request</h1>
    <img class="page-image" src="images/add-request.jpg"
         alt="Blood donation and request" onerror="this.style.display='none'">

    <form id="requestForm">
        <div class="form-group">
            <label for="hospital">Hospital Name</label>
            <input id="hospital" name="hospital_name" type="text" required maxlength="150">
        </div>

        <div class="form-group">
            <label for="bloodGroup">Blood Group</label>
            <select id="bloodGroup" name="blood_group" required>
                <option value="">Select blood group</option>
                <option>A+</option><option>A-</option>
                <option>B+</option><option>B-</option>
                <option>AB+</option><option>AB-</option>
                <option>O+</option><option>O-</option>
            </select>
        </div>

        <div class="form-group">
            <label for="units">Units Required</label>
            <input id="units" name="units_required" type="number" min="1" required>
        </div>

        <div class="form-group">
            <label for="date">Request Date</label>
            <input id="date" name="request_date" type="date" required>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Fulfilled">Fulfilled</option>
                <option value="Rejected">Rejected</option>
            </select>
        </div>

        <button type="submit">Submit Request</button>
        <p id="message" class="message"></p>
    </form>
</main>

<script>
document.getElementById("date").value =
    new Date().toISOString().slice(0, 10);

document.getElementById("requestForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = Object.fromEntries(new FormData(this).entries());
    data.units_required = Number(data.units_required);

    try {
        const response = await fetch("/api/requests", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) throw new Error(result.message || result.error || "Request failed");

        document.getElementById("message").textContent =
            "Blood request added successfully!";
        this.reset();
        document.getElementById("date").value =
            new Date().toISOString().slice(0, 10);
    } catch (error) {
        document.getElementById("message").textContent =
            "Error: " + error.message;
    }
});
</script>
</body>
</html>
