<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Blood Stock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="nav-container">
        <a class="brand" href="index.html">Blood Bank Management</a>

        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="donors.html">Donors</a>
            <a href="blood-stock.html">Blood Stock</a>
            <a href="blood-requests.html">Blood Requests</a>
            <a href="reports.html">Reports</a>
        </nav>
    </div>
</header>

<main class="form-container">
    <div class="update-stock image">
        <img src="images/update-stock.jpg"
        alt="blood updates">
    </div>

    <h1>Update Blood Stock</h1>

    <p>Select a blood group and enter the updated units.</p>

    <form id="stockForm">

        <div class="form-group">
            <label for="bloodGroup">Blood Group</label>

            <select id="bloodGroup" required>
                <option value="">Select Blood Group</option>
            </select>
        </div>

        <div class="form-group">
            <label for="currentUnits">Current Units</label>

            <input
                type="number"
                id="currentUnits"
                readonly
            >
        </div>

        <div class="form-group">
            <label for="units">New Units Available</label>

            <input
                type="number"
                id="units"
                min="0"
                step="1"
                required
            >
        </div>

        <button type="submit" class="btn">
            Save Changes
        </button>

        <a href="view-stock.html" class="btn">
            View Stock
        </a>

        <a href="blood-stock.html" class="btn">
            Back
        </a>

        <p id="message" class="message"></p>

    </form>

</main>

<script>
const groupSelect = document.getElementById("bloodGroup");
const currentInput = document.getElementById("currentUnits");
const unitsInput = document.getElementById("units");
const message = document.getElementById("message");

async function loadGroups() {
    try {
        const response = await fetch("/api/stock");

        if (!response.ok) {
            throw new Error("Unable to load blood groups.");
        }

        const stocks = await response.json();

        groupSelect.replaceChildren(
            new Option("Select Blood Group", "")
        );

        stocks.forEach(stock => {
            groupSelect.add(
                new Option(stock.blood_group, stock.blood_group)
            );
        });

    } catch (error) {
        message.textContent = error.message;
    }
}

groupSelect.addEventListener("change", async () => {
    currentInput.value = "";
    unitsInput.value = "";
    message.textContent = "";

    if (!groupSelect.value) return;

    try {
        const response = await fetch(
            "/api/stock/" + encodeURIComponent(groupSelect.value)
        );

        if (!response.ok) {
            throw new Error("Unable to retrieve selected blood group.");
        }

        const data = await response.json();
        const stock = Array.isArray(data) ? data[0] : data;

        if (!stock) {
            throw new Error("Stock record not found.");
        }

        currentInput.value = stock.units_available ?? "";
        unitsInput.value = stock.units_available ?? "";

    } catch (error) {
        message.textContent = error.message;
    }
});

document.getElementById("stockForm").addEventListener(
    "submit",
    async event => {
        event.preventDefault();

        const group = groupSelect.value;
        const newUnits = Number(unitsInput.value);

        if (!group) {
            message.textContent = "Please select a blood group.";
            return;
        }

        if (!Number.isInteger(newUnits) || newUnits < 0) {
            message.textContent = "Enter a valid number of units.";
            return;
        }

        try {
            const response = await fetch(
                "/api/stock/" + encodeURIComponent(group),
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        units_available: newUnits
                    })
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(
                    result.message || result.error || "Update failed."
                );
            }

            currentInput.value = newUnits;

            message.textContent =
                "Blood stock updated successfully.";

        } catch (error) {
            message.textContent = "Error: " + error.message;
        }
    }
);

loadGroups();
</script>

</body>
</html>
